update:
  name: 在庫更新
  description: 指定した品目の在庫を追加または消費する
  fields:
    item:
      name: 品目ID
      description: 商品のUUID
      required: true
      selector:
        text:
    action:
      name: 操作
      description: add（追加）または remove（消費）
      required: true
      selector:
        select:
          options:
            - add
            - remove
    number:
      name: 数量
      description: 変更する数量（デフォルト1）
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 9999
          mode: box
